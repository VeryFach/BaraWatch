[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barawatch-ai"
version = "0.1.0"
description = "Standalone BaraWatch AI service foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
]
# Instal dependensi modul AI tambahan hanya saat modul tersebut dikembangkan.
clustering = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "pandas>=2.2,<3"]
geo = ["shapely>=2,<3", "geopandas>=1,<2", "pyproj>=3.6,<4"]
earth = ["earthengine-api>=1,<2"]
vision = ["ultralytics>=8,<9", "pillow>=10,<12"]
risk = ["xgboost>=2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]