services:
  barawatch-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: barawatch-ai:latest
    ports:
      - "${BARAWATCH_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BARAWATCH_DEVICE: cpu
      BURN_AREA_CACHE_DIR: /tmp/barawatch-burn-area-cache
    volumes:
      - ./models/weights:/service/models/weights:ro
      - hf-cache:/opt/huggingface
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  model-cache:
  hf-cache:
