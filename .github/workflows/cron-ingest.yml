name: Ingest FIRMS hotspots

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: firms-hotspot-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected backend cron route
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_BASE_URL" || { echo "APP_BASE_URL is not configured"; exit 1; }
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not configured"; exit 1; }
          curl --fail --silent --show-error --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/cron/ingest-hotspots"
